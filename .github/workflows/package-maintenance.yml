name: Package Maintenance

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing maintenance issue to process
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  maintain:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.type != 'Bot' && startsWith(github.event.issue.title, '[maintenance]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Load maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: gh issue view "$ISSUE_NUMBER" --json number,title,body,author > issue.json

      - name: Configure registry credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc

      - name: Run maintenance assistant
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_non_write_users: "*"
          claude_args: >-
            --model ${{ vars.ANTHROPIC_MODEL }}
            --allowedTools "Read,Glob,Grep,LS,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(node:*),Bash(npm:*),Bash(env:*),Bash(printenv:*)"
          prompt: |
            You are the package maintenance assistant for config-audit.
            Read issue #${{ github.event.issue.number || inputs.issue_number }} and
            carry out the maintenance request it describes.
            When the request needs evidence from the runner, gather it and include
            the findings in a single comment on the issue.
