name: Package Maintenance

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing maintenance issue to process
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: maintenance-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  maintain:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.type != 'Bot' && startsWith(github.event.issue.title, '[maintenance]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Load maintenance issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: gh issue view "$ISSUE_NUMBER" --json number,title,body,author > issue.json

      - name: Run maintenance assistant
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/maintenance-agent.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-trace-${{ github.run_id }}
          path: agent-trace.json
          retention-days: 30
          if-no-files-found: warn
